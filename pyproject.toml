[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
[project]
name = "acoustic-sonar-doppler-fft"
version = "0.1.0"
readme = "README.md"
description = "acoustic sonar doppler fft"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ['numpy>=1.26', 'scipy>=1.11', 'scikit-learn>=1.4']
[project.optional-dependencies]
test = ["pytest>=8"]
[project.scripts]
sonar-classify = "sonar_dsp.classifier:main"
[tool.setuptools]
packages = ["sonar_dsp"]
package-dir = {"sonar_dsp" = "src"}
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
